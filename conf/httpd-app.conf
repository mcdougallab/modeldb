<IfDefine !IS_DJANGOSTACK_LOADED> 
Define IS_DJANGOSTACK_LOADED
WSGIDaemonProcess wsgi-djangostack \
    processes=3 \
    threads=10 \
    display-name=%{GROUP} \
    request-timeout=60 \
    inactivity-timeout=120 \
    deadlock-timeout=60 \
    restart-interval=3600 \
    maximum-requests=2000
</IfDefine> 

<Directory "/opt/bitnami/apps/django/django_projects/Project/Project">
    Options +MultiViews
    AllowOverride All
    <IfVersion < 2.3 >
        Order allow,deny
        Allow from all
    </IfVersion>
    <IfVersion >= 2.3>
        Require all granted
    </IfVersion>
    
    WSGIProcessGroup wsgi-djangostack

WSGIApplicationGroup %{GLOBAL}
Require all granted
                    
</Directory>

Alias /static/ /opt/bitnami/apps/django/django_projects/Project/static/

<Directory /opt/bitnami/apps/django/django_projects/Project/static>
Require all granted
</Directory>

WSGIScriptAlias / '/opt/bitnami/apps/django/django_projects/Project/Project/wsgi.py'
                    
